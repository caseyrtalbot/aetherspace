[package]
name = "aetherspace"
version = "0.1.0"
edition = "2024"
description = "A personal command-center terminal built with Ratatui: project navigation, a markdown and script viewer, an embedded shell, and a clean statusline."
license = "MIT"
authors = ["Casey Talbot <caseyrtalbot@gmail.com>"]
readme = "README.md"
keywords = ["tui", "terminal", "ratatui", "command-center"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
gix = { version = "0.84.0", default-features = false, features = ["status", "sha1"] }
portable-pty = "0.9.0"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39.3", default-features = false, features = ["system"] }
toml = "0.9"
# default features off → drops the `highlight-code` feature (syntect + ansi-to-tui),
# so code blocks use our foreground-only MarkdownTheme instead of syntect backgrounds.
tui-markdown = { version = "0.3.7", default-features = false }
tui-term = "0.3.4"
# Display-width measurement for the statusline width budget (already transitive
# via ratatui/tui-markdown; depended on directly so the version is ours to pin).
unicode-width = "0.2.2"
ureq = { version = "3.3.0", default-features = false }

[dev-dependencies]
tempfile = "3"
