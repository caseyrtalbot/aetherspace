# Aetherspace configuration — example.
#
# Copy to:  ~/.config/aetherspace/config.toml
#   (or $XDG_CONFIG_HOME/aetherspace/config.toml if XDG_CONFIG_HOME is set).
#
# Every field is optional. With no config file at all, Aetherspace runs on the
# defaults shown below. A partial file fills the rest with defaults; a file that
# fails to parse is ignored (logged) and the defaults are used, so a typo never
# stops the app from starting.
#
# Paths are taken verbatim: a literal "~" is NOT expanded. Use absolute paths.

# Directory scanned for git projects. Immediate subdirectories that contain a
# .git entry become nav entries, sorted by .git/HEAD mtime (most recently active
# first), with a name tiebreak. Default: ~/Projects (resolved from $HOME).
projects_root = "/Users/you/Projects"

# Pin the project list instead of discovering it. When present, this is used
# verbatim and projects_root is ignored. Omit the whole block to use discovery.
# [[projects]]
# name = "thought-engine"
# path = "/Users/you/Projects/thought-engine"
# viewer = "README.md"
#
# [[projects]]
# name = "aetherspace"
# path = "/Users/you/Projects/aetherspace"
# viewer = "docs/working/GREENFIELD-TERMINAL-SPEC.md"

# Statusline health probes. Each is GET'd on the health cadence. Default: none.
# The compact statusline reports reachable probes as health:ok/total.
[[probes]]
name = "spark"
url = "http://localhost:9292/health"

# Poll cadences in seconds. The full git walk is decoupled from the lighter
# system and health polls so a large repo does not churn a core every tick.
[poll]
sys_secs = 2     # CPU + memory refresh
git_secs = 10    # branch + dirty-tree walk for the selected project
health_secs = 2  # probe GETs

# Embedded shell settings.
[shell]
scrollback = 10000  # lines of PTY scrollback retained

# Input settings.
[input]
leader = "ctrl-space"  # accepts ctrl-space, ctrl-@, ctrl-g, alt-g, esc

# Keymap overrides (sparse). Two tables mirror the two dispatch surfaces:
#   [keymap.global]  always-on shortcuts, matched on the EXACT chord (with
#                    modifiers): keys like "f2", "ctrl-enter", "ctrl-tab".
#   [keymap.leader]  keys pressed AFTER the leader, matched on the key only
#                    (modifiers ignored): a single char like "q" or a name.
# Each entry is  chord = "action". Only the chords you list change; everything
# else keeps its built-in default. An unknown key or action drops just that one
# entry with a one-line warning (a typo never wedges the rest of the keymap).
#
# Key spellings: single chars ("q"), "space", "tab", "backtab", "enter", "esc",
#   "left"/"right"/"up"/"down", "f1".."f12". Global chords may prefix modifiers:
#   "ctrl-"/"alt-"/"shift-" (e.g. "ctrl-enter", "alt-tab").
# Action names (snake_case): quit, split_horizontal, split_vertical, restart,
#   close, focus_next, focus_prev, resize_grow, resize_shrink, zoom, float,
#   toggle_stack, toggle_compact, help, command_palette, project_palette,
#   viewer, shell, edit_scrollback.
#
# [keymap.leader]
# x = "quit"           # press leader then x to quit
#
# [keymap.global]
# f12 = "command_palette"

# Workflow defaults.
[workflow]
startup_project = "aetherspace"  # optional; exact project name from the nav list
default_viewer = "README.md"      # relative to the selected project unless absolute
